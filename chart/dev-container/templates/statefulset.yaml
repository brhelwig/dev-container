apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dev-container.fullname" . }}
  labels:
    {{- include "dev-container.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "dev-container.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "dev-container.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dev-container.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dev-container.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}-{{ required `arch is required (amd64 or arm64) — images are published as arch-suffixed tags, not a multi-arch manifest` .Values.arch }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- if or .Values.sshAuthorizedKeys .Values.tailscale.authKeySecretName }}
          env:
            {{- if .Values.sshAuthorizedKeys }}
            - name: SSH_AUTHORIZED_KEYS
              value: {{ join "\n" .Values.sshAuthorizedKeys | quote }}
            {{- end }}
            {{- if .Values.tailscale.authKeySecretName }}
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tailscale.authKeySecretName }}
                  key: {{ .Values.tailscale.authKeySecretKey }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/dev
      volumes:
        - name: home
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "dev-container.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- $nodeSelector := .Values.nodeSelector | default dict }}
      {{- if .Values.arch }}
      {{- $nodeSelector = merge (dict "kubernetes.io/arch" .Values.arch) $nodeSelector }}
      {{- end }}
      {{- if $nodeSelector }}
      nodeSelector:
        {{- toYaml $nodeSelector | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
