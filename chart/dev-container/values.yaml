image:
  repository: ghcr.io/brhelwig/dev-container
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

replicaCount: 1

command: []
args: ["sleep", "infinity"]

sshAuthorizedKeys: []

tailscale:
  authKeySecretName: ""
  authKeySecretKey: authkey

# Required: amd64 or arm64. Images are published as arch-suffixed tags
# (e.g. latest-amd64), so this both selects the image and pins scheduling
# via kubernetes.io/arch.
arch: ""

nodeSelector: {}
affinity: {}
tolerations: []

resources:
  requests:
    cpu: 1000m
    memory: 4Gi
  limits:
    cpu: 4000m
    memory: 8Gi

persistence:
  enabled: true
  retainOnDelete: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  existingClaim: ""

securityContext:
  privileged: true

podSecurityContext:
  fsGroup: 1000

podAnnotations: {}
podLabels: {}
